# ==========================================================
# sentiment-analyzer - Docker Compose
# ----------------------------------------------------------
# Single-service compose file for local development.
# Run: make docker-up
# ==========================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-analyzer-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Pin all mutable state onto the volume. These take precedence over
      # .env, whose relative defaults are meant for local (non-Docker) runs.
      ASA_RAG_DB_PATH: /app/data/runs.duckdb
      ASA_VECTOR_STORE_PATH: /app/data/vector_store
      HF_HOME: /app/data/hf
    volumes:
      # Persist DuckDB run storage, vector store and model cache across restarts
      - run-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  run-data:
    driver: local
