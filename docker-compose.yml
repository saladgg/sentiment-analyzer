# ==========================================================
# sentiment-analyzer - Docker Compose
# ----------------------------------------------------------
# Single-service compose file for local development.
# Run: make docker-up
# ==========================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-analyzer-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist DuckDB run storage and vector store across restarts
      - run-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  run-data:
    driver: local
