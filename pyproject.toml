# ==========================================================
# sentiment-analyzer - Project Configuration
# ==========================================================

[project]
name = "sentiment-analyzer"
version = "0.1.1"
description = "Input-agnostic, explainable sentiment analysis platform with optional RAG-based context enrichment."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Salad Guyo", email = "saladguyo60@gmail.com" }]
license = { text = "MIT" }
keywords = [
  "sentiment-analysis",
  "nlp",
  "transformers",
  "rag",
  "fastapi",
  "explainability",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]

dependencies = [
  # API & Server
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",

  # Configuration & Validation
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.21",

  # Data Processing
  "pandas>=2.3.3",
  "numpy>=2.4.0",
  "openpyxl>=3.1",

  # Classical ML
  "scikit-learn>=1.8.0",

  # NLP & Transformers
  "torch>=2.9.1",
  "transformers>=4.57.3",
  "sentence-transformers>=5.2.0",
  "langchain-huggingface>=1.2.0",

  # LLM Provider (supports OpenAI, Anthropic, Ollama, Azure, Groq, etc.)
  "litellm>=1.83.3",

  # Vector Store (Local RAG)
  "chromadb>=1.4.0",

  # Persistence
  "duckdb>=1.4.3",

  # Logging & Observability
  "structlog>=25.5.0",

  # Utilities
  "tqdm>=4.67.1",

  # Frontend
  "streamlit>=1.56.0",
  "plotly>=6.1.0",
  "requests>=2.32.0",
]

[dependency-groups]
test = [
  "pytest>=9.0.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "Faker>=35.0",
]

dev = [
  { include-group = "test" },
  "ruff>=0.7",
  "httpx>=0.28",
  "types-requests>=2.32",
  "mypy>=1.14",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/saladgg/sentiment-analyzer" # todo
Repository = "https://github.com/saladgg/sentiment-analyzer"
Documentation = "https://github.com/saladgg/sentiment-analyzer/docs"
Changelog = "https://github.com/saladgg/sentiment-analyzer/releases"

# ----------------------------------------------------------
# Build System
# ----------------------------------------------------------

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sentiment_analyzer*"]

# ----------------------------------------------------------
# Tool Configuration
# ----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["sentiment_analyzer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra -q --cov=sentiment_analyzer --cov-report=term-missing"
filterwarnings = [
    # Upstream: chromadb still uses ``asyncio.iscoroutinefunction``.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.*",
]

[tool.coverage.run]
branch = true
source = ["sentiment_analyzer"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
strict = false
ignore_missing_imports = true
files = ["sentiment_analyzer", "tests"]

# ----------------------------------------------------------
# PSR Configuration
# ----------------------------------------------------------


[tool.semantic_release]
commit_parser = "conventional"
version_toml = [
    "pyproject.toml:project.version:tf"
]
branch = "main"
build_command = "python -m build"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false # Override default behavior of suppressing detailed changelog on first version

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "build", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]   # refactor is often patch, but some teams treat it as minor
