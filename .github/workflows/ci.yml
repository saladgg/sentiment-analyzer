name: CI

# main is covered by release.yml, which calls this workflow as a gate
# before releasing, so it is excluded here to avoid running twice.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies (fails on a stale lockfile)
        run: make install-dev

      - name: Format check
        run: make format-check

      - name: Lint & type check
        run: make lint

      - name: Test (coverage gate in pyproject.toml)
        run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Audit locked dependencies for known vulnerabilities
        run: make audit

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build API image
        run: docker build --target api -t sentiment-analyzer-api:ci .

      - name: Boot and probe /healthz and /readyz
        run: |
          docker run -d --name api -p 8000:8000 sentiment-analyzer-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          curl -fsS -X POST http://localhost:8000/api/v1/analyze \
            -H 'content-type: application/json' \
            -d '{"source_type": "text", "data": "great product\nterrible support"}'

      - name: Container logs
        if: always()
        run: docker logs api || true
