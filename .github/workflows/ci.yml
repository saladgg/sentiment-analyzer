name: CI

# main is covered by release.yml, which calls this workflow as a gate
# before releasing, so it is excluded here to avoid running twice.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies (fail on a stale lockfile)
        run: uv sync --locked --group dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test
